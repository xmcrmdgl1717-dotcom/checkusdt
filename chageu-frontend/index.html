<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查个U - USDT转账查询与能量闪租</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">
                <span>查个U</span>
                <small>USDT交易记录查询工具</small>
            </div>
            <nav class="nav-menu">
                <a href="/">首页</a>
                <a href="energy.html">能量闪租</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- 顶部查询区 -->
        <section class="hero-card">
            <div class="hero-kicker">USDT转账查询 · 交易哈希查询</div>
            <h1>USDT转账查询工具</h1>
            <p>输入USDT地址或交易哈希，查询公开链上转账记录、到账状态和交易详情。</p>
            
            <div class="usdt-search-panel">
                <form class="usdt-search-form" onsubmit="handleSearch(event)">
                    <input type="text" id="searchInput" placeholder="请输入USDT地址或交易哈希" required>
                    <button type="submit">立即查询</button>
                </form>
                <p class="usdt-search-note">本站仅查询公开链上信息，请勿输入私钥或密码。</p>
            </div>

            <!-- 汇率模块 -->
            <div class="rate-bar" id="rateBar">
                <div class="rate-card"><span>TRX参考汇率</span><strong id="trxPrice">加载中...</strong></div>
                <div class="rate-card"><span>USDT参考汇率</span><strong id="usdtPrice">1.00 USD</strong></div>
            </div>
        </section>

        <!-- 服务入口 -->
        <section class="services">
            <a href="energy.html" class="service-card">
                <div class="icon">⚡</div>
                <h3>能量闪租</h3>
                <p>一笔也是批发价，自动到账</p>
            </a>
            <a href="https://t.me/你的TG机器人" target="_blank" class="service-card">
                <div class="icon">🤖</div>
                <h3>TG机器人</h3>
                <p>USDT与TRX交易提醒</p>
            </a>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 查个U. 所有查询结果仅供参考。</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
